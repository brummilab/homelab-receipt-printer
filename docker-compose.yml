services:
  receipt-printer:
    image: ghcr.io/brummilab/homelab-receipt-printer:latest
    container_name: receipt-printer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Vienna
      - PRINTER_DEVICE=/dev/usb/lp0
      - CRON_SCHEDULE=0 6 * * *
      - PANGOLIN_URL=https://brummilab.org
      # Backup paths to check (last-modified timestamp)
      - BACKUP_PATHS=/backups/immich,/backups/musik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/tank/media:/backups:ro
      - /mnt/tank:/mnt/tank:ro
      - receipt-printer-config:/config
    # USB printer — uncomment if not using network/LAN backend
    # devices:
    #   - /dev/usb/lp0:/dev/usb/lp0

volumes:
  receipt-printer-config:
